# Casos de evaluación en inglés: lo que escribiría alguien que usa el editor en inglés.
# Misma cobertura que es.toml (ops en ambos sentidos con intensidad, export, varios pasos,
# negaciones, estilos, unsupported, ambiguos e injection), con frases de uso real y no solo
# las que son fáciles de reconocer por palabra clave.
# Formato: docs/PROMPT_ENGINE.md § Evaluación. Los descriptores usan las claves de
# `prompting/descriptors.py::describe`; la etiqueta de balance de blancos va en español porque
# así la genera `describe`.

# ------------------------------------------------------------------------------------ tono
[[cases]]
id = "en-brighter-slightly"
prompt = "Make it slightly brighter"
expect = "ops"
require = [["exposure", "auto_exposure", "shadows"]]
sign = { "exposure.ev" = "+", "shadows.amount" = "+" }
max = { "exposure.ev" = 0.9 }
tags = ["tono", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.34, exposure_ev = -0.6, clipped_shadows = 0.04, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.31 }

[[cases]]
id = "en-darker-a-lot"
prompt = "Make it a lot darker, it's way too bright"
expect = "ops"
require = [["exposure", "highlights", "whites"]]
sign = { "exposure.ev" = "-", "highlights.amount" = "-", "whites.amount" = "-" }
max = { "exposure.ev" = -0.7 }
tags = ["tono", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.78, exposure_ev = 1.3, clipped_shadows = 0.0, clipped_highlights = 0.15, white_balance_estimate = "neutro", median_luminance = 0.82 }

[[cases]]
id = "en-whites-pop"
prompt = "The whites look dull and grayish, make them pop"
expect = "ops"
require = [["whites", "exposure", "auto_exposure", "contrast"]]
sign = { "whites.amount" = "+", "exposure.ev" = "+" }
tags = ["tono"]
descriptors = { width = 5000, height = 3333, orientation = "horizontal", mean_luminance = 0.6, exposure_ev = -0.3, clipped_shadows = 0.0, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.62 }

[[cases]]
id = "en-blacks-deeper"
prompt = "Deepen the blacks a little, it looks washed out"
expect = "ops"
require = [["blacks", "contrast"]]
sign = { "blacks.amount" = "-", "contrast.amount" = "+" }
min = { "blacks.amount" = -50 }
tags = ["tono", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.58, exposure_ev = 0.2, clipped_shadows = 0.0, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.57 }

[[cases]]
id = "en-contrast-a-lot"
prompt = "Add a lot of contrast"
expect = "ops"
require = ["contrast"]
sign = { "contrast.amount" = "+" }
min = { "contrast.amount" = 35 }
tags = ["tono", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.0, clipped_shadows = 0.0, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.5 }

[[cases]]
id = "en-contrast-too-harsh"
prompt = "It looks too harsh, soften the contrast"
expect = "ops"
require = ["contrast"]
sign = { "contrast.amount" = "-" }
tags = ["tono"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.46, exposure_ev = 0.1, clipped_shadows = 0.12, clipped_highlights = 0.1, white_balance_estimate = "neutro", median_luminance = 0.44 }

# ----------------------------------------------------------------------------------- color
[[cases]]
id = "en-warmer-a-bit"
prompt = "Make it a bit warmer"
expect = "ops"
require = ["white_balance"]
sign = { "white_balance.temperature_shift" = "+" }
max = { "white_balance.temperature_shift" = 45 }
tags = ["color", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.47, exposure_ev = 0.0, white_balance_estimate = "neutro" }

[[cases]]
id = "en-cooler-icy"
prompt = "I want much cooler tones, a cold icy blue look"
expect = "ops"
require = ["white_balance"]
sign = { "white_balance.temperature_shift" = "-" }
max = { "white_balance.temperature_shift" = -30 }
tags = ["color", "intensidad", "estilo"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.1, white_balance_estimate = "neutro" }

[[cases]]
id = "en-fix-white-balance"
prompt = "Fix the white balance automatically"
expect = "ops"
require = [["auto_white_balance", "white_balance"]]
sign = { "white_balance.temperature_shift" = "-" }
tags = ["color"]
descriptors = { width = 5472, height = 3648, orientation = "horizontal", mean_luminance = 0.33, exposure_ev = -0.5, clipped_shadows = 0.03, white_balance_estimate = "muy cálido (tungsteno)", median_luminance = 0.3 }

[[cases]]
id = "en-green-tint"
prompt = "There's a green tint over everything, get rid of it"
expect = "ops"
require = [["white_balance", "auto_white_balance"]]
sign = { "white_balance.tint_shift" = "+" }
tags = ["color"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.4, exposure_ev = -0.2, white_balance_estimate = "neutro, verdoso" }

[[cases]]
id = "en-tone-down-colors"
prompt = "Tone down the colors, they're way too intense"
expect = "ops"
require = [["saturation", "vibrance"]]
sign = { "saturation.amount" = "-", "vibrance.amount" = "-" }
tags = ["color"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.45, exposure_ev = 0.0, white_balance_estimate = "neutro" }

[[cases]]
id = "en-saturate-a-lot"
prompt = "Boost the saturation a lot"
expect = "ops"
require = ["saturation"]
sign = { "saturation.amount" = "+" }
min = { "saturation.amount" = 35 }
tags = ["color", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.0, white_balance_estimate = "neutro" }

# --------------------------------------------------------------------------------- geometría
[[cases]]
id = "en-crop-16-9"
prompt = "Crop it to 16:9"
expect = "ops"
require = ["crop"]
values = { "crop.aspect_ratio" = "16:9" }
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

[[cases]]
id = "en-rotate-clockwise"
prompt = "Rotate it 90 degrees clockwise"
expect = "ops"
require = ["rotate"]
sign = { "rotate.degrees" = "+" }
abs = { "rotate.degrees" = 90 }
tags = ["geometria"]
descriptors = { width = 4000, height = 6000, orientation = "vertical" }

[[cases]]
id = "en-level-horizon"
prompt = "The horizon is tilted by about 2 degrees, level it"
expect = "ops"
require = ["straighten"]
abs = { "straighten.degrees" = 2 }
forbid = ["rotate"]
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.2 }

[[cases]]
id = "en-resize-height-1200"
prompt = "Resize it to 1200 pixels tall"
expect = "ops"
require = ["resize"]
values = { "resize.height" = 1200 }
forbid = ["crop"]
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

# ---------------------------------------------------------------------------------- detalle
[[cases]]
id = "en-sharpen-slightly"
prompt = "Sharpen it slightly"
expect = "ops"
require = ["sharpen"]
max = { "sharpen.amount" = 40 }
tags = ["detalle", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.46, exposure_ev = 0.0 }

[[cases]]
id = "en-reduce-grain-keep-detail"
prompt = "Reduce the grain a bit but keep the detail"
expect = "ops"
require = ["denoise"]
max = { "denoise.strength" = 0.5 }
tags = ["detalle", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.18, exposure_ev = -1.7, clipped_shadows = 0.2, clipped_highlights = 0.0, white_balance_estimate = "cálido", median_luminance = 0.14 }

[[cases]]
id = "en-subtle-vignette"
prompt = "Add a subtle dark vignette"
expect = "ops"
require = ["vignette"]
sign = { "vignette.amount" = "-" }
min = { "vignette.amount" = -40 }
tags = ["detalle", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.0 }

# ----------------------------------------------------------------------------------- export
[[cases]]
id = "en-export-tiff-print"
prompt = "Export it as TIFF so I can print it"
expect = "ops"
values = { "export.format" = "tiff" }
tags = ["export"]
descriptors = { width = 7000, height = 4667, orientation = "horizontal" }

[[cases]]
id = "en-remove-location"
prompt = "Strip the location data when you export it"
expect = "ops"
values = { "export.metadata" = "strip_gps" }
tags = ["export"]
descriptors = { width = 4032, height = 3024, orientation = "horizontal" }

[[cases]]
id = "en-instagram-feed-4-5"
prompt = "Prep it for the Instagram feed, 4:5 portrait"
expect = "ops"
require = ["crop"]
values = { "crop.aspect_ratio" = "4:5" }
tags = ["export", "geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

# ------------------------------------------------------------------------------- varios pasos
[[cases]]
id = "en-multi-brighten-warm-webp"
prompt = "Brighten it, make it warmer, boost the vibrance, sharpen a bit and export as webp"
expect = "ops"
require = [["exposure", "auto_exposure", "shadows"], "white_balance", ["vibrance", "saturation"], "sharpen"]
sign = { "exposure.ev" = "+", "white_balance.temperature_shift" = "+", "vibrance.amount" = "+", "saturation.amount" = "+" }
values = { "export.format" = "webp" }
tags = ["multi"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.3, exposure_ev = -0.9, clipped_shadows = 0.07, white_balance_estimate = "neutro" }

[[cases]]
id = "en-multi-five-steps"
prompt = "Crop to 16:9, open up the shadows, pull back the highlights, remove the noise and resize to 1920 wide"
expect = "ops"
require = ["crop", "shadows", "highlights", "denoise", "resize"]
sign = { "shadows.amount" = "+", "highlights.amount" = "-" }
values = { "crop.aspect_ratio" = "16:9", "resize.width" = 1920 }
tags = ["multi"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.35, exposure_ev = -0.6, clipped_shadows = 0.14, clipped_highlights = 0.09, white_balance_estimate = "neutro" }

# -------------------------------------------------------------------------------- negaciones
[[cases]]
id = "en-neg-dont-touch-colors"
prompt = "Don't touch the colors, just fix the exposure"
expect = "ops"
require = [["exposure", "auto_exposure"]]
sign = { "exposure.ev" = "+" }
forbid = ["saturation", "vibrance", "white_balance", "auto_white_balance"]
tags = ["negacion", "tono", "descriptores"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.24, exposure_ev = -1.5, clipped_shadows = 0.15, white_balance_estimate = "neutro", median_luminance = 0.21 }

[[cases]]
id = "en-neg-no-crop-no-resize"
prompt = "Make it pop but do not crop or resize it"
expect = "ops"
require = [["contrast", "saturation", "vibrance", "sharpen"]]
forbid = ["crop", "resize", "rotate", "straighten"]
tags = ["negacion"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.44, exposure_ev = 0.0, white_balance_estimate = "neutro" }

