# Casos de evaluación en español (voseo rioplatense, español neutro y variantes de España/México).
# Cubre las 18 ops del catálogo en ambos sentidos con palabras de intensidad ("un poquito",
# "mucho"), export, pedidos de varios pasos, negaciones, estilos mapeados a ops, pedidos fuera
# del catálogo (unsupported), pedidos ambiguos y prompt injection.
# Formato: docs/PROMPT_ENGINE.md § Evaluación. Los criterios piden solo lo que el usuario dijo
# claramente; donde dos editores razonables harían cosas distintas hay alternativas o `any`.
# Convención: "recortala para X" exige la op `crop` con la proporción (se ve en la preview),
# como en los casos del spike #5; un preset solo no alcanza.

# ------------------------------------------------------------------------------------ tono
[[cases]]
id = "es-luz-voseo"
prompt = "Aclarala un poco, quedó medio oscura"
expect = "ops"
require = [["exposure", "auto_exposure", "shadows"]]
sign = { "exposure.ev" = "+", "shadows.amount" = "+" }
max = { "exposure.ev" = 1.5 }
tags = ["tono"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.27, exposure_ev = -1.1, clipped_shadows = 0.08, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.24 }

[[cases]]
id = "es-oscurecer-quemada"
prompt = "Oscurecela bastante, quedó toda quemada"
expect = "ops"
require = [["exposure", "highlights", "whites"]]
sign = { "exposure.ev" = "-", "highlights.amount" = "-", "whites.amount" = "-" }
tags = ["tono"]
descriptors = { width = 5472, height = 3648, orientation = "horizontal", mean_luminance = 0.74, exposure_ev = 1.0, clipped_shadows = 0.0, clipped_highlights = 0.14, white_balance_estimate = "neutro", median_luminance = 0.77 }

[[cases]]
id = "es-corregir-exposicion-oscura"
prompt = "Corregí la exposición"
expect = "ops"
require = [["exposure", "auto_exposure"]]
sign = { "exposure.ev" = "+" }
tags = ["tono", "descriptores"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.2, exposure_ev = -1.8, clipped_shadows = 0.21, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.17 }

[[cases]]
id = "es-corregir-exposicion-clara"
prompt = "Corregí la exposición"
expect = "ops"
require = [["exposure", "highlights", "auto_exposure"]]
sign = { "exposure.ev" = "-", "highlights.amount" = "-" }
tags = ["tono", "descriptores"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.76, exposure_ev = 1.2, clipped_shadows = 0.0, clipped_highlights = 0.12, white_balance_estimate = "neutro", median_luminance = 0.8 }

[[cases]]
id = "es-menos-contraste-poco"
prompt = "Un poco menos de contraste"
expect = "ops"
require = ["contrast"]
sign = { "contrast.amount" = "-" }
min = { "contrast.amount" = -40 }
tags = ["tono", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.45, exposure_ev = 0.1, clipped_shadows = 0.04, clipped_highlights = 0.03, white_balance_estimate = "neutro", median_luminance = 0.43 }

[[cases]]
id = "es-levanta-sombras"
prompt = "Levanta las sombras, las caras salieron muy oscuras"
expect = "ops"
require = ["shadows"]
sign = { "shadows.amount" = "+" }
tags = ["tono"]
descriptors = { width = 4000, height = 6000, orientation = "vertical", mean_luminance = 0.33, exposure_ev = -0.7, clipped_shadows = 0.15, clipped_highlights = 0.02, white_balance_estimate = "neutro", median_luminance = 0.3 }

[[cases]]
id = "es-bajale-luces-altas"
prompt = "Bájale a las luces altas, el cielo salió quemado"
expect = "ops"
require = [["highlights", "whites"]]
sign = { "highlights.amount" = "-", "whites.amount" = "-" }
tags = ["tono"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.55, exposure_ev = 0.4, clipped_shadows = 0.01, clipped_highlights = 0.18, white_balance_estimate = "frío", median_luminance = 0.56 }

[[cases]]
id = "es-negros-profundos"
prompt = "Hundí los negros, quiero que tenga más profundidad"
expect = "ops"
require = [["blacks", "contrast"]]
sign = { "blacks.amount" = "-", "contrast.amount" = "+" }
tags = ["tono"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.2, clipped_shadows = 0.0, clipped_highlights = 0.01, white_balance_estimate = "neutro", median_luminance = 0.5 }

