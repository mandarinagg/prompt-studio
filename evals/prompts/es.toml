[[cases]]
id = "es-menos-saturacion-poquito"
prompt = "Bajá un poquito la saturación"
expect = "ops"
require = ["saturation"]
sign = { "saturation.amount" = "-" }
min = { "saturation.amount" = -40 }
tags = ["color", "intensidad"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.47, exposure_ev = 0.0, clipped_shadows = 0.01, clipped_highlights = 0.02, white_balance_estimate = "neutro", median_luminance = 0.46 }

[[cases]]
id = "es-colores-sin-quemar-piel"
prompt = "Dale más vida a los colores pero que no se queme la piel"
expect = "ops"
require = [["vibrance", "saturation"]]
