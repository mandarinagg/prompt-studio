tags = ["color", "intensidad"]
descriptors = { width = 5472, height = 3648, orientation = "horizontal", mean_luminance = 0.42, exposure_ev = -0.2, clipped_shadows = 0.02, clipped_highlights = 0.01, white_balance_estimate = "cálido", median_luminance = 0.4 }

