descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.12, exposure_ev = -2.3, clipped_shadows = 0.3, clipped_highlights = 0.0, white_balance_estimate = "cálido", median_luminance = 0.08 }

