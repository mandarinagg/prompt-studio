tags = ["color", "intensidad"]
descriptors = { width = 4000, height = 6000, orientation = "vertical", mean_luminance = 0.44, exposure_ev = -0.1, clipped_shadows = 0.01, clipped_highlights = 0.01, white_balance_estimate = "neutro", median_luminance = 0.43 }

# --------------------------------------------------------------------------------- geometría
[[cases]]
id = "es-recortala-cuadrada"
prompt = "Recortala cuadrada"
expect = "ops"
require = ["crop"]
values = { "crop.aspect_ratio" = "1:1" }
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

[[cases]]
id = "es-girar-izquierda"
prompt = "Girala 90 grados a la izquierda"
expect = "ops"
require = ["rotate"]
sign = { "rotate.degrees" = "-" }
abs = { "rotate.degrees" = 90 }
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

[[cases]]
id = "es-cabeza-abajo"
prompt = "Quedó cabeza abajo, ponela derecha"
expect = "ops"
require = ["rotate"]
abs = { "rotate.degrees" = 180 }
forbid = ["straighten"]
tags = ["geometria"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

[[cases]]
id = "es-horizonte-chueco"
prompt = "El horizonte quedó chueco, enderezalo"
expect = "clarification_or_ops"
require_if_ops = ["straighten"]
forbid = ["rotate"]
tags = ["geometria", "ambiguo"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.5, exposure_ev = 0.1 }

[[cases]]
id = "es-ancho-1920"
prompt = "Pasala a 1920 px de ancho"
expect = "ops"
require = ["resize"]
values = { "resize.width" = 1920 }
forbid = ["crop"]
tags = ["geometria", "export"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal" }

