# ------------------------------------------------------------------------------- varios pasos
[[cases]]
id = "es-multi-cinco-pasos"
prompt = "Aclarala un poco, bajale la saturación, sacale el ruido, hacela cuadrada y exportala en webp"
expect = "ops"
require = [["exposure", "auto_exposure", "shadows"], "saturation", "denoise", "crop"]
sign = { "exposure.ev" = "+", "shadows.amount" = "+", "saturation.amount" = "-" }
values = { "crop.aspect_ratio" = "1:1", "export.format" = "webp" }
tags = ["multi"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.22, exposure_ev = -1.4, clipped_shadows = 0.17, clipped_highlights = 0.0, white_balance_estimate = "neutro", median_luminance = 0.19 }

[[cases]]
id = "es-multi-enderezar-contraste"
prompt = "Enderezala 1 grado, ponele más contraste, que quede cálida y subile un poco la nitidez"
expect = "ops"
require = ["straighten", "contrast", "white_balance", "sharpen"]
sign = { "contrast.amount" = "+", "white_balance.temperature_shift" = "+" }
abs = { "straighten.degrees" = 1 }
tags = ["multi"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.46, exposure_ev = 0.0, white_balance_estimate = "neutro" }

[[cases]]
id = "es-multi-amarillo-1600"
prompt = "Sacale lo amarillo, levantale las sombras, bajale las luces altas y pasala a 1600 de ancho"
expect = "ops"
require = [["white_balance", "auto_white_balance"], "shadows", "highlights", "resize"]
sign = { "white_balance.temperature_shift" = "-", "shadows.amount" = "+", "highlights.amount" = "-" }
values = { "resize.width" = 1600 }
tags = ["multi"]
descriptors = { width = 6000, height = 4000, orientation = "horizontal", mean_luminance = 0.4, exposure_ev = -0.3, clipped_shadows = 0.1, clipped_highlights = 0.1, white_balance_estimate = "muy cálido", median_luminance = 0.38 }

