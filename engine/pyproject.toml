[project]
name = "pstudio"
version = "0.1.0"
description = "Motor de PROMPT STUDIO: edición de fotos/videos guiada por planes de edición validados."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyvips[binary]>=3.2",
    "numpy>=2",
    "pydantic>=2.12",
]  # ADR-0005

[project.scripts]
pstudio = "pstudio:main"

[project.optional-dependencies]
cloud = [
    "anthropic>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
package = [
    "pyinstaller>=6.22.3",
]
# Solo para spikes de M0 (engine/spikes/); no son dependencias del paquete.
spike = [
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "psutil>=6",
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
