# CI del engine: lint + tests en Windows (plataforma primaria, ver HARDWARE_COMPATIBILITY.md).
name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      # Acciones fijadas por SHA (repo público: evita que un tag movido cambie el código).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: engine
          enable-cache: true
      # Python exacto de engine/.python-version (ADR-0008); --locked falla si uv.lock no coincide.
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pstudio --version
